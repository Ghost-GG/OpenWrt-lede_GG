name: 编译 LEDE x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lede-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      CCACHE_MAXSIZE: 3G
    defaults:
      run:
        shell: bash
    steps:
      - name: 获取编译配置
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 清理磁盘并安装依赖
        timeout-minutes: 25
        run: |
          # 只清理 GitHub 临时运行器中与 LEDE 编译无关的预装组件。
          mkdir -p artifacts/logs
          df -hT / /mnt "$GITHUB_WORKSPACE" | tee artifacts/logs/disk-before.txt
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          # 本任务不使用容器镜像；保留 swap，避免将磁盘问题转化为内存不足。
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gcc-multilib g++-multilib gettext genisoimage git gperf help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm libnsl-dev ninja-build p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip wget \
            xmlto xxd xz-utils zlib1g-dev
          sudo apt-get clean
          df -hT / /mnt "$GITHUB_WORKSPACE" | tee artifacts/logs/disk-after-cleanup.txt
          swapon --show | tee artifacts/logs/swap.txt
          free -h

      - name: 获取最新源码及 feeds
        timeout-minutes: 30
        run: |
          git clone --depth 1 --branch master https://github.com/coolsnowwolf/lede.git openwrt
          cp feeds.conf.default openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          # 每次跟随上游更新，同时保存实际提交，方便定位版本相关问题。
          mkdir -p ../artifacts/buildinfo
          git rev-parse HEAD > ../artifacts/buildinfo/source.version
          ./scripts/feeds list -s -f > ../artifacts/buildinfo/feeds.lock
          cp feeds.conf.default ../artifacts/buildinfo/
          ./scripts/feeds install -a

      - name: 解析并核对编译配置
        id: configure
        run: |
          mkdir -p artifacts/buildinfo artifacts/logs
          python3 scripts/test-check-config.py
          cp .config openwrt/.config
          make -C openwrt defconfig 2>&1 | tee artifacts/logs/defconfig.log
          cp openwrt/.config artifacts/buildinfo/resolved.config
          python3 scripts/check-config.py .config openwrt/.config
          cd openwrt
          ./scripts/diffconfig.sh > ../artifacts/buildinfo/diffconfig
          ./scripts/feeds list -s > ../artifacts/buildinfo/feeds.buildinfo

      - name: 恢复下载和编译缓存
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: lede-x86-22-v2-${{ hashFiles('artifacts/buildinfo/source.version', 'artifacts/buildinfo/feeds.lock', '.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lede-x86-22-v2-${{ hashFiles('artifacts/buildinfo/source.version', 'artifacts/buildinfo/feeds.lock', '.config') }}-

      - name: 下载源码包
        timeout-minutes: 20
        run: |
          # 通过 make 参数启用主机编译缓存，不修改用户的固件配置。
          make -C openwrt download -j8 CONFIG_CCACHE=y 2>&1 | tee artifacts/logs/download.log

      - name: 检查编译前磁盘空间
        run: |
          # 同时记录容量、inode 和目录占用，便于判断是否需要利用独立的 /mnt 磁盘。
          df -hT / /mnt "$GITHUB_WORKSPACE" | tee artifacts/logs/disk-before-build.txt
          df -i / /mnt "$GITHUB_WORKSPACE" | tee artifacts/logs/inodes-before-build.txt
          du -h --max-depth=1 openwrt | sort -h | tee artifacts/logs/directories-before-build.txt

      - name: 编译固件
        id: compile
        timeout-minutes: 300
        run: |
          df -h
          # 多线程失败后单线程输出详细错误，两次尝试共用此步骤的超时限额。
          if ! make -C openwrt -j"$(nproc)" CONFIG_CCACHE=y 2>&1 | tee artifacts/logs/build.log; then
            make -C openwrt -j1 V=s CONFIG_CCACHE=y 2>&1 | tee artifacts/logs/build-retry.log
          fi

      - name: 上传固件及目标软件包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LEDE-x86_64-${{ github.run_number }}
          path: openwrt/bin/targets/x86/64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 保存缓存供下次使用
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.cache.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: 整理诊断日志
        if: always()
        run: |
          mkdir -p artifacts/logs
          df -hT > artifacts/logs/disk.txt
          df -i > artifacts/logs/inodes.txt
          free -h > artifacts/logs/memory.txt
          find artifacts/logs -type f -name '*.log' -exec gzip -f {} +

      - name: 上传日志和实际编译配置
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LEDE-buildinfo-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
